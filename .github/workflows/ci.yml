name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Clean, test, build distributions, and verify plugin
        run: bash ./gradlew clean test buildPlugin cliDistZip verifyPluginProjectConfiguration verifyPlugin --no-daemon --no-build-cache

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ti84-evo-plugin
          path: build/distributions/ti84-evo-for-pycharm-*.zip
          if-no-files-found: error

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ti84-evo-cli
          path: build/distributions/ti84-evo-cli-*.zip
          if-no-files-found: error
